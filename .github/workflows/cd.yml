# validação deploy da aplicação homolog, infraestrutura, add-ons e observabilidade
name: CD

on:
  push:
    branches: [main, homolog]
    paths:
      - '.github/workflows/cd.yml'
      - '.github/workflows/deploy.yml'
      - '.mvn/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'src/**'
      - 'Dockerfile'
      - 'mvnw'
      - 'pom.xml'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Validate application
    if: github.ref_name == 'homolog' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate format, architecture and tests
        run: |
          chmod +x mvnw
          ./mvnw -B spotless:check verify

  build-publish:
    name: Docker build & push (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate image tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SAFE_REF="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE}:${GITHUB_SHA}
          ${IMAGE}:${SAFE_REF}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo "image_ref=${IMAGE}:${GITHUB_SHA}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-homolog:
    name: Deploy HOMOLOG
    needs: build-publish
    if: github.ref == 'refs/heads/homolog'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: homolog
      namespace: oficina-homolog
      image_ref: ${{ needs.build-publish.outputs.image_ref }}
    secrets: inherit

  deploy-production:
    name: Deploy PRODUÇÃO
    needs: build-publish
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      namespace: oficina-production
      image_ref: ${{ needs.build-publish.outputs.image_ref }}
    secrets: inherit
